name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./manifest.json').version")"
          package="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$package" ]; then
            echo "Tag $GITHUB_REF_NAME, manifest.json $manifest, package.json $package" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:bundle

      - name: Pack
        run: |
          npm run pack
          zip="pulse-${GITHUB_REF_NAME#v}.zip"
          mv pulse.zip "$zip"
          sha256sum "$zip" > "$zip.sha256"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: pulse-*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pulse-*.zip pulse-*.zip.sha256 \
            --title "Pulse ${GITHUB_REF_NAME#v}" \
            --notes "Built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Verify with: gh attestation verify pulse-${GITHUB_REF_NAME#v}.zip --repo $GITHUB_REPOSITORY"
